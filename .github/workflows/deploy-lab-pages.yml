name: deploy-lab-pages

on:
  push:
    branches:
      - main
    paths:
      # Lab 산출물(dist-lab)을 바꿀 수 있는 경로다. public/은 전체가 복사되고, Classic 보관본(assets-lab/classic/versions/)은
      # /lab/skin-versions/로, 비행 배경 텍스처(output/imagegen/)는 비행 배경 번들과 Flight Background Preview로 들어간다.
      # Lab 빌드가 이 밖의 파일을 새로 읽게 되면 여기에 추가한다.
      - ".github/workflows/deploy-lab-pages.yml"
      - "assets-lab/classic/versions/**"
      - "lab/**"
      - "output/imagegen/**"
      - "output/prototypes/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.lab.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm 활성화
        run: corepack enable

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Lab 정적 사이트 빌드
        run: pnpm run build:lab

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-lab

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
