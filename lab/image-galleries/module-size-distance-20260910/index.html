<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>크기 × 거리 9개 시안</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#070b11;color:#dbe4ef;font-family:Arial,"Noto Sans CJK KR",sans-serif}
main{display:grid;grid-template-columns:repeat(3,900px);grid-template-rows:repeat(3,560px);width:2700px;height:1680px}
figure{margin:0;width:900px;height:560px;border:2px solid #152133;overflow:hidden}
figcaption{height:52px;display:flex;align-items:center;gap:16px;padding:0 20px;font-size:24px}
b{color:#e1a05b}img{display:block;width:896px;height:504px;object-fit:contain}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:none;width:100%;height:auto}figure{width:100%;height:auto}figcaption{height:auto;min-height:52px;padding:12px 16px;font-size:17px}img{width:100%;height:auto;aspect-ratio:1672/941}}
</style>
<main><figure><figcaption><b>A</b>소형 × 근거리</figcaption><img src="01-small-near.png" alt="A · 소형 × 근거리" decoding="async" fetchpriority="high"></figure>
<figure><figcaption><b>B</b>소형 × 중거리</figcaption><img data-src="02-small-middle.png" alt="B · 소형 × 중거리" decoding="async"></figure>
<figure><figcaption><b>C</b>소형 × 원거리</figcaption><img data-src="03-small-far.png" alt="C · 소형 × 원거리" decoding="async"></figure>
<figure><figcaption><b>D</b>중형 × 근거리</figcaption><img data-src="04-medium-near.png" alt="D · 중형 × 근거리" decoding="async"></figure>
<figure><figcaption><b>E</b>중형 × 중거리</figcaption><img data-src="05-medium-middle.png" alt="E · 중형 × 중거리" decoding="async"></figure>
<figure><figcaption><b>F</b>중형 × 원거리</figcaption><img data-src="06-medium-far.png" alt="F · 중형 × 원거리" decoding="async"></figure>
<figure><figcaption><b>G</b>거대 × 근거리</figcaption><img data-src="07-giant-near.png" alt="G · 거대 × 근거리" decoding="async"></figure>
<figure><figcaption><b>H</b>거대 × 중거리</figcaption><img data-src="08-giant-middle-v2.png" alt="H · 거대 × 중거리" decoding="async"></figure>
<figure><figcaption><b>I</b>거대 × 원거리</figcaption><img data-src="09-giant-far.png" alt="I · 거대 × 원거리" decoding="async"></figure></main>
<script>
const deferredImages=[...document.querySelectorAll('img[data-src]')];
const loadImage=(image)=>{image.src=image.dataset.src;image.removeAttribute('data-src')};
if('IntersectionObserver'in window){const observer=new IntersectionObserver((entries)=>{for(const entry of entries){if(!entry.isIntersecting)continue;loadImage(entry.target);observer.unobserve(entry.target)}});deferredImages.forEach((image)=>observer.observe(image))}else{deferredImages.forEach(loadImage)}
</script></html>
